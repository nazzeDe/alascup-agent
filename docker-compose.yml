services:
  # 前端 Web 界面 (Alpine.js 静态页面 + Nginx)
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - web-server

  # 核心编排层
  web-server:
    build:
      context: ./web-server
    container_name: web-server
    restart: unless-stopped
    working_dir: /app
    environment:
      - HOST=0.0.0.0
      - PORT=11450
      - DATABASE_URL=postgresql+asyncpg://alascup:alascup@postgres:5432/alascup
      - TOOLSERVER_SHARED_SECRET=${TOOLSERVER_SHARED_SECRET:?TOOLSERVER_SHARED_SECRET required}
    volumes:
      - ./web-server/config:/app/config:ro,Z
      - ./logs/web-server:/app/logs:Z
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: "0.50"
    depends_on:
      - postgres
      - tool-server

  # 数据库
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=alascup
      - POSTGRES_PASSWORD=alascup
      - POSTGRES_DB=alascup
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.00"
    expose:
      - "5432"

  # 工具执行层（感知 + 运维操作）
  tool-server:
    build:
      context: ./tool-server
    container_name: tool-server
    restart: unless-stopped
    environment:
      - TOOLSERVER_HOST_EXEC=${TOOLSERVER_HOST_EXEC:-nsenter}
      - TOOLSERVER_HOST=0.0.0.0
      - TOOLSERVER_LOG_DIR=/app/logs
      - TOOLSERVER_SHARED_SECRET=${TOOLSERVER_SHARED_SECRET:?TOOLSERVER_SHARED_SECRET required}
      - POSTGRES_DSN=postgresql://alascup:alascup@postgres:5432/alascup
    volumes:
      - /var/log:/host/var/log:ro,Z
      - /proc:/host/proc:ro,Z
      - /sys:/host/sys:ro,Z
      - /:/host_root:ro,Z
      - /sys/kernel/btf:/sys/kernel/btf:ro,Z
      - /sys/kernel/tracing:/sys/kernel/tracing:ro,Z
      - ./logs/tool-server:/app/logs:Z
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/sandbox:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      memlock:
        soft: -1
        hard: -1
    privileged: false
    cap_add:
      # --- 进程工具 ---
      - SYS_PTRACE      # strace, /proc/<pid>/exe 读取
      - KILL            # kill, systemctl stop
      # --- 网络工具 ---
      - NET_ADMIN       # ss, 网络命名空间操作
      - NET_RAW         # tcpdump, ping
      # --- 文件访问 ---
      - DAC_READ_SEARCH # 读取宿主机只读挂载（/proc, /sys, /var/log）
      # --- 系统服务管理 ---
      - SYS_ADMIN       # systemctl start/stop/restart/daemon-reload（注释即禁用）
      - SYS_CHROOT      # chroot host execution mode on Kylin/LoongArch
      # --- 内核诊断 ---
      - SYSLOG          # dmesg
      - BPF             # bpftrace 等 BPF 程序加载
      - PERFMON         # perf_event_open 访问
    pid: "host"
    pids_limit: 512
    mem_limit: 768m
    cpus: "1.00"
    expose:
      - "11451"

volumes:
  pgdata:
