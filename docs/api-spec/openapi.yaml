openapi: 3.0.3
info:
  title: alascup-agent API
  version: 0.1.0
  description: web-server OpenAPI 规范，定义前端与后端的全部 REST 契约。
servers:
  - url: /api
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.1.0

  /chat:
    post:
      summary: LLM 聊天入口（SSE 流式响应）
      description: |
        前端发送用户消息，web-server 驱动 Agent 循环（AgentLoop），
        通过 SSE 流式返回 assistant、reasoning、tool_call、tool_result、审批请求等全部事件。
        SSE 连接在完整对话轮次内保持不中断。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                chat_id:
                  type: string
                  description: 已存在会话的 _id；不传则自动创建新会话
                message:
                  type: string
                  description: 用户输入文本
                model:
                  type: string
                  description: 可选，指定大模型标识
                options:
                  type: object
                  description: 传递给 LLMAdapter 的可选运行时参数（max_tokens 等）
      responses:
        "200":
          description: SSE 事件流（text/event-stream）
        "400":
          description: 请求参数错误

  /sessions:
    get:
      summary: 列出全部会话
      responses:
        "200":
          description: 会话摘要列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
    post:
      summary: 创建新会话
      responses:
        "201":
          description: 会话已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"

  /sessions/{chat_id}:
    get:
      summary: 获取会话详情（messages + executed_tool_list）
      parameters:
        - in: path
          name: chat_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ChatSession
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        "404":
          description: 会话不存在

  /tools:
    get:
      summary: 列出全部可用工具
      description: 返回 tool-server 注册的全部 MCP 工具元数据
      responses:
        "200":
          description: 工具列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"

  /tool-requests/{request_id}/approval:
    post:
      summary: 审批工具请求（批准或拒绝）
      description: 前端用户对高风险 tool_call 做出批准或拒绝决定。后端接收后恢复 Agent 循环，事件通过已存在的 SSE 连接继续推送。
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolApproval"
      responses:
        "200":
          description: 审批已处理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolApprovalResult"
        "404":
          description: 请求不存在或已过期

components:
  schemas:
    Message:
      type: object
      required: [message_id, chat_id, timestamp, type, content]
      properties:
        message_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum: [user, assistant, tool_call, tool_result, system]
        content:
          type: string
        is_meta:
          type: boolean
          default: false
          description: 是否为对话状态的描述性消息（如"审批已通过"）

    Tool:
      type: object
      required: [name, server, description, is_read_only, is_rollbackable]
      properties:
        name:
          type: string
          description: 工具唯一名称
        server:
          type: string
          enum: [tool-server]
          description: 所属 MCP Server
        description:
          type: string
          description: LLM 可见的工具描述
        is_read_only:
          type: boolean
          description: 由 tool-server 根据参数内容动态判定是否只读
        is_rollbackable:
          type: boolean
          description: 由 tool-server 根据参数内容动态判定是否可回滚
        params_schema:
          type: object
          description: JSON Schema，定义工具参数

    ToolCall:
      allOf:
        - $ref: "#/components/schemas/Tool"
        - type: object
          required:
            [
              chat_id,
              message_id,
              params,
              approval_status,
              execution_status,
              timestamp,
            ]
          properties:
            chat_id:
              type: string
              format: uuid
            message_id:
              type: string
              format: uuid
            params:
              type: object
            request_id:
              type: string
              format: uuid
              description: 仅高风险操作需要
            approval_status:
              type: string
              enum: [PENDING, APPROVED, REJECTED, EXPIRED]
            execution_status:
              type: string
              enum: [PENDING_APPROVAL, RUNNING, SUCCEEDED, FAILED]
            error:
              type: object
              description: 执行失败时的错误信息
            timestamp:
              type: string
              format: date-time

    ToolRequest:
      allOf:
        - $ref: "#/components/schemas/Tool"
        - type: object
          required:
            [
              chat_id,
              message_id,
              request_id,
              params,
              approval_status,
              created_at,
            ]
          properties:
            chat_id:
              type: string
              format: uuid
            message_id:
              type: string
              format: uuid
            request_id:
              type: string
              format: uuid
            params:
              type: object
            approval_status:
              type: string
              enum: [PENDING, APPROVED, REJECTED, EXPIRED]
            created_at:
              type: string
              format: date-time
            approved_at:
              type: string
              format: date-time
            expired_at:
              type: string
              format: date-time
            rejected_reason:
              type: string

    ToolApproval:
      type: object
      required: [approval_status]
      properties:
        approval_status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        reason:
          type: string

    ToolApprovalResult:
      type: object
      required: [request_id, approval_status]
      properties:
        request_id:
          type: string
          format: uuid
        approval_status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        reason:
          type: string
          description: 审批备注（可选）

    ToolResult:
      type: object
      required: [execution_status]
      properties:
        execution_status:
          type: string
          enum: [SUCCEEDED, FAILED, SECURITY_VIOLATION]
        backup_ref:
          type: string
          description: 可回滚操作的备份引用
        output:
          type: object
        error:
          type: object

    ChatSession:
      type: object
      required: [chat_id, messages, executed_tool_list, timestamp]
      properties:
        chat_id:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        executed_tool_list:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
        timestamp:
          type: string
          format: date-time

    AssistantEventData:
      type: object
      required: [delta]
      properties:
        chat_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        delta:
          type: string
          description: LLM 文本增量

    ToolCallEventData:
      type: object
      required: [chat_id, message_id, tool_name, params, is_read_only]
      properties:
        chat_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        tool_name:
          type: string
        params:
          type: object
        is_read_only:
          type: boolean
        server:
          type: string

    ToolResultEventData:
      type: object
      required: [chat_id, message_id, tool_name, execution_status]
      properties:
        chat_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        tool_name:
          type: string
        execution_status:
          type: string
          enum: [SUCCEEDED, FAILED]
        output:
          type: object
        error:
          type: object
        execution_time_ms:
          type: integer

    ToolApprovalRequiredEventData:
      type: object
      required: [chat_id, request_id, tool_name, params, reason]
      properties:
        chat_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        tool_name:
          type: string
        params:
          type: object
          description: 调用参数；可变工具（bash）包含完整 command 字段
        reason:
          type: string
          description: 需要审批的原因说明

    ReasoningEventData:
      type: object
      required: [delta]
      properties:
        chat_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        delta:
          type: string
          description: 推理文本增量
        done:
          type: boolean
          description: 是否完成推理

    ErrorEventData:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    DoneEventData:
      type: object
      required: [chat_id]
      properties:
        chat_id:
          type: string
          format: uuid

    SSEEvent:
      type: object
      description: SSE 流事件。event 字段由 SSE 协议 line 承载，data 为 JSON 序列化 payload。
      properties:
        event:
          type: string
          enum:
            [
              assistant,
              reasoning,
              tool_call,
              tool_result,
              tool_approval_required,
              error,
              done,
            ]
        data:
          oneOf:
            - $ref: "#/components/schemas/AssistantEventData"
            - $ref: "#/components/schemas/ReasoningEventData"
            - $ref: "#/components/schemas/ToolCallEventData"
            - $ref: "#/components/schemas/ToolResultEventData"
            - $ref: "#/components/schemas/ToolApprovalRequiredEventData"
            - $ref: "#/components/schemas/ErrorEventData"
            - $ref: "#/components/schemas/DoneEventData"
