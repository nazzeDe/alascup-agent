<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">当前已实现能力与下一步演进</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">清晰说明项目边界，让能力表达更可信</text>
  </g>
  <g filter="url(#shadow)">
<rect x="160" y="250" width="720" height="500" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="160" y="250" width="720" height="12" rx="18" fill="#1f8f7a"/>
<text x="188" y="308" font-size="29" fill="#162233" font-weight="800" text-anchor="start">当前已实现或已设计支撑</text>
<text x="188" y="352" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• B/S 聊天式运维界面</text>
<text x="188" y="394" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• ReAct Agent 循环</text>
<text x="188" y="436" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• MCP 工具发现与调用</text>
<text x="188" y="478" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• OS 感知工具与 bash/systemd</text>
<text x="188" y="512" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  运维工具</text>
<text x="188" y="554" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 高风险审批、安全规则、二次校验</text>
<text x="188" y="596" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 会话、审计、LLM trace 持久化</text>
</g>
<g filter="url(#shadow)">
<rect x="1040" y="250" width="720" height="500" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1040" y="250" width="720" height="12" rx="18" fill="#2b6cb0"/>
<text x="1068" y="308" font-size="29" fill="#162233" font-weight="800" text-anchor="start">下一步演进</text>
<text x="1068" y="352" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 故障知识库沉淀</text>
<text x="1068" y="394" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• KySEC/KSAF 策略联动</text>
<text x="1068" y="436" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• eBPF 长时运行和异常订阅</text>
<text x="1068" y="478" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 更精细 RBAC 与组织权限</text>
<text x="1068" y="520" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 诊断延迟和审批耗时性能基准</text>
</g>
<text x="220" y="855" font-size="26" fill="#607385" font-weight="400" text-anchor="start">边界：多租户、统一身份认证、全量实时监控平台是当前非目标，不在演示中夸大。</text>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">21/22</text>
  </g>
</svg>