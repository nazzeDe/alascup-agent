<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">从用户指令到执行结果全程留痕</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">PostgreSQL 持久化会话、消息、工具调用、审计事件和 LLM trace</text>
  </g>
  <rect x="160" y="315" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="160" y="315" width="190" height="10" rx="16" fill="#2b6cb0"/>
<text x="255" y="371" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">接收指令</text>
<line x1="368" y1="361" x2="408" y2="361" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="428" y="315" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="428" y="315" width="190" height="10" rx="16" fill="#1f8f7a"/>
<text x="523" y="371" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">感知环境</text>
<line x1="636" y1="361" x2="676" y2="361" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="696" y="315" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="696" y="315" width="190" height="10" rx="16" fill="#d58b22"/>
<text x="791" y="371" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">推理决策</text>
<line x1="904" y1="361" x2="944" y2="361" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="964" y="315" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="964" y="315" width="190" height="10" rx="16" fill="#c94a4a"/>
<text x="1059" y="371" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">安全校验</text>
<line x1="1172" y1="361" x2="1212" y2="361" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1232" y="315" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1232" y="315" width="190" height="10" rx="16" fill="#1f9d62"/>
<text x="1327" y="371" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">执行结果</text>
<line x1="1440" y1="361" x2="1480" y2="361" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1500" y="315" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1500" y="315" width="190" height="10" rx="16" fill="#1f8f7a"/>
<text x="1595" y="371" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">审计事件</text>
<g filter="url(#shadow)">
<rect x="180" y="545" width="350" height="220" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="180" y="545" width="350" height="12" rx="18" fill="#2b6cb0"/>
<text x="208" y="603" font-size="29" fill="#162233" font-weight="800" text-anchor="start">messages</text>
<text x="208" y="647" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 用户消息</text>
<text x="208" y="689" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• Agent 回复</text>
<text x="208" y="731" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• reasoning_conten</text>
<text x="208" y="765" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  t</text>
<text x="208" y="807" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• tool_result</text>
</g>
<g filter="url(#shadow)">
<rect x="570" y="545" width="350" height="220" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="570" y="545" width="350" height="12" rx="18" fill="#1f8f7a"/>
<text x="598" y="603" font-size="29" fill="#162233" font-weight="800" text-anchor="start">tool_calls</text>
<text x="598" y="647" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 参数</text>
<text x="598" y="689" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 审批状态</text>
<text x="598" y="731" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 执行状态</text>
<text x="598" y="773" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 结果和错误</text>
</g>
<g filter="url(#shadow)">
<rect x="960" y="545" width="350" height="220" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="960" y="545" width="350" height="12" rx="18" fill="#d58b22"/>
<text x="988" y="603" font-size="29" fill="#162233" font-weight="800" text-anchor="start">audit_events</text>
<text x="988" y="647" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 仅追加写入</text>
<text x="988" y="689" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• actor / event</text>
<text x="988" y="731" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• decision /</text>
<text x="988" y="765" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  transition</text>
</g>
<g filter="url(#shadow)">
<rect x="1350" y="545" width="350" height="220" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1350" y="545" width="350" height="12" rx="18" fill="#1f9d62"/>
<text x="1378" y="603" font-size="29" fill="#162233" font-weight="800" text-anchor="start">llm_traces</text>
<text x="1378" y="647" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 模型与 token</text>
<text x="1378" y="689" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 延迟</text>
<text x="1378" y="731" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• prompt /</text>
<text x="1378" y="765" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  completion</text>
</g>
<text x="220" y="870" font-size="30" fill="#1f8f7a" font-weight="800" text-anchor="start">评委能看到的不只是结果，还能复盘：为什么这样做、谁批准了、执行结果是什么。</text>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">12/22</text>
  </g>
</svg>