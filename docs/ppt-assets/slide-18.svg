<text x="988" y="308" font-size="29" fill="#162233" font-weight="800" text-anchor="start">Mock E2E</text>
<text x="988" y="352" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 前端交互</text>
<text x="988" y="394" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 审批 UI</text>
<text x="988" y="436" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 错误恢复</text>
