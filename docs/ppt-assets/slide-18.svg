<text x="1388" y="308" font-size="29" fill="#162233" font-weight="800" text-anchor="start">Live E2E</text>
<text x="1388" y="352" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• nginx +</text>
<text x="1388" y="386" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  web-server</text>
<text x="1388" y="428" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• tool-server +</text>
