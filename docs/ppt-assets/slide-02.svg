<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">从人工排障到可信智能运维</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">在提升排障效率的同时，解决 AI 推理不可控和 OS 操作高风险问题</text>
  </g>
  <g filter="url(#shadow)">
<rect x="120" y="230" width="520" height="520" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="120" y="230" width="520" height="12" rx="18" fill="#c94a4a"/>
<text x="148" y="288" font-size="29" fill="#162233" font-weight="800" text-anchor="start">传统运维痛点</text>
<text x="148" y="332" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 脚本分散，依赖个人经验</text>
<text x="148" y="374" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 故障证据跨进程、日志、网络和配置</text>
<text x="148" y="416" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 执行动作风险高，过程难以复盘</text>
</g>
<g filter="url(#shadow)">
<rect x="700" y="230" width="520" height="520" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="700" y="230" width="520" height="12" rx="18" fill="#1f8f7a"/>
<text x="728" y="288" font-size="29" fill="#162233" font-weight="800" text-anchor="start">AI Agent 机会</text>
<text x="728" y="332" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 自然语言描述目标</text>
<text x="728" y="374" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 自动选择工具收集证据</text>
<text x="728" y="416" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 围绕根因持续迭代分析</text>
</g>
<g filter="url(#shadow)">
<rect x="1280" y="230" width="520" height="520" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1280" y="230" width="520" height="12" rx="18" fill="#d58b22"/>
<text x="1308" y="288" font-size="29" fill="#162233" font-weight="800" text-anchor="start">核心挑战</text>
<text x="1308" y="332" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 大模型推理存在不确定性</text>
<text x="1308" y="374" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 不能把 root 权限直接交给模型</text>
<text x="1308" y="416" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 需要安全护栏与审计闭环</text>
</g>
<rect x="320" y="835" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="320" y="835" width="190" height="10" rx="16" fill="#c94a4a"/>
<text x="415" y="891" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">告警</text>
<line x1="528" y1="881" x2="568" y2="881" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="588" y="835" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="588" y="835" width="190" height="10" rx="16" fill="#2b6cb0"/>
<text x="683" y="891" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">诊断</text>
<line x1="796" y1="881" x2="836" y2="881" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="856" y="835" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="856" y="835" width="190" height="10" rx="16" fill="#d58b22"/>
<text x="951" y="891" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">审批</text>
<line x1="1064" y1="881" x2="1104" y2="881" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1124" y="835" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1124" y="835" width="190" height="10" rx="16" fill="#1f9d62"/>
<text x="1219" y="891" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">执行</text>
<line x1="1332" y1="881" x2="1372" y2="881" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1392" y="835" width="190" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1392" y="835" width="190" height="10" rx="16" fill="#1f8f7a"/>
<text x="1487" y="891" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">审计回放</text>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">02/22</text>
  </g>
</svg>