<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">清理不是直接删除，而是诊断、评估、审批、执行</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">典型演示二：磁盘清理的安全闭环</text>
  </g>
  <rect x="150" y="230" width="1620" height="600" rx="24" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<text x="210" y="300" font-size="30" fill="#162233" font-weight="850" text-anchor="start">演示输入</text>
<rect x="210" y="330" width="1180" height="76" rx="18" fill="#e8f2ff"/>
<text x="245" y="379" font-size="26" fill="#162233" font-weight="700" text-anchor="start">磁盘空间快满了，请分析哪些目录占用较多，并给出安全清理建议。</text>
<text x="210" y="485" font-size="30" fill="#162233" font-weight="850" text-anchor="start">演示流程</text>
<rect x="220" y="501" width="58" height="48" rx="12" fill="#d58b22"/>
<text x="249" y="533" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="300" y="535" font-size="25" fill="#607385" font-weight="400" text-anchor="start">调用磁盘和日志只读工具</text>
<rect x="220" y="559" width="58" height="48" rx="12" fill="#d58b22"/>
<text x="249" y="591" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="300" y="593" font-size="25" fill="#607385" font-weight="400" text-anchor="start">定位可疑目录或大日志</text>
<rect x="220" y="617" width="58" height="48" rx="12" fill="#d58b22"/>
<text x="249" y="649" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="300" y="651" font-size="25" fill="#607385" font-weight="400" text-anchor="start">生成清理计划并说明风险</text>
<rect x="220" y="675" width="58" height="48" rx="12" fill="#d58b22"/>
<text x="249" y="707" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="300" y="709" font-size="25" fill="#607385" font-weight="400" text-anchor="start">删除类动作弹出审批卡片</text>
<rect x="220" y="733" width="58" height="48" rx="12" fill="#d58b22"/>
<text x="249" y="765" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="300" y="767" font-size="25" fill="#607385" font-weight="400" text-anchor="start">批准后执行，拒绝后停止高危动作</text>
<g filter="url(#shadow)">
<rect x="1220" y="470" width="460" height="260" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
