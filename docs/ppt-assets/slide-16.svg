<text x="1248" y="528" font-size="29" fill="#162233" font-weight="800" text-anchor="start">展示价值</text>
<text x="1248" y="572" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 对应赛题场景</text>
<text x="1248" y="614" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 展示安全护栏</text>
<text x="1248" y="656" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 审批与审计闭环</text>
