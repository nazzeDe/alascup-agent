<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">对命令行执行面进行细粒度收敛</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">bash 是最灵活也最危险的入口，因此按只读免审批能力严格分类</text>
  </g>
  <rect x="180" y="245" width="1560" height="520" rx="22" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="180" y="245" width="1560" height="70" rx="22" fill="#0e1a2a"/>
<text x="230" y="292" font-size="26" fill="#ffffff" font-weight="800" text-anchor="start">命令</text>
<text x="920" y="292" font-size="26" fill="#ffffff" font-weight="800" text-anchor="start">分类</text>
<text x="1250" y="292" font-size="26" fill="#ffffff" font-weight="800" text-anchor="start">行为</text>
<rect x="220" y="323" width="1480" height="70" rx="8" fill="#f8fbfd"/>
<text x="240" y="369" font-size="25" fill="#162233" font-weight="700" text-anchor="start">ps aux | grep nginx</text>
<text x="940" y="369" font-size="25" fill="#1f8f7a" font-weight="800" text-anchor="start">只读</text>
<text x="1260" y="369" font-size="25" fill="#607385" font-weight="700" text-anchor="start">自动执行</text>
<rect x="220" y="409" width="1480" height="70" rx="8" fill="#ffffff"/>
<text x="240" y="455" font-size="25" fill="#162233" font-weight="700" text-anchor="start">journalctl -u nginx --no-pager</text>
<text x="940" y="455" font-size="25" fill="#1f8f7a" font-weight="800" text-anchor="start">只读</text>
<text x="1260" y="455" font-size="25" fill="#607385" font-weight="700" text-anchor="start">自动执行</text>
<rect x="220" y="495" width="1480" height="70" rx="8" fill="#f8fbfd"/>
<text x="240" y="541" font-size="25" fill="#162233" font-weight="700" text-anchor="start">rm -rf /var/log/app.log</text>
<text x="940" y="541" font-size="25" fill="#d58b22" font-weight="800" text-anchor="start">高风险</text>
<text x="1260" y="541" font-size="25" fill="#607385" font-weight="700" text-anchor="start">需要审批</text>
<rect x="220" y="581" width="1480" height="70" rx="8" fill="#ffffff"/>
<text x="240" y="627" font-size="25" fill="#162233" font-weight="700" text-anchor="start">cat /etc/shadow</text>
<text x="940" y="627" font-size="25" fill="#d58b22" font-weight="800" text-anchor="start">敏感读取</text>
<text x="1260" y="627" font-size="25" fill="#607385" font-weight="700" text-anchor="start">fail-closed</text>
<rect x="220" y="667" width="1480" height="70" rx="8" fill="#f8fbfd"/>
<text x="240" y="713" font-size="25" fill="#162233" font-weight="700" text-anchor="start">bash -c &#x27;...&#x27;</text>
<text x="940" y="713" font-size="25" fill="#d58b22" font-weight="800" text-anchor="start">复杂执行面</text>
<text x="1260" y="713" font-size="25" fill="#607385" font-weight="700" text-anchor="start">fail-closed</text>
<text x="230" y="835" font-size="27" fill="#607385" font-weight="400" text-anchor="start">tree-sitter-bash 解析 AST，解析失败、重定向、子 shell、命令替换、敏感路径均按</text>
<text x="230" y="876" font-size="27" fill="#607385" font-weight="400" text-anchor="start">fail-closed 处理。</text>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">10/22</text>
  </g>
</svg>