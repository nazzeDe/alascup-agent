<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">可落地的安全智能运维底座</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">把大模型能力放进可治理的操作系统运维流程中</text>
  </g>
  <g filter="url(#shadow)">
<rect x="175" y="260" width="420" height="260" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="175" y="260" width="420" height="12" rx="18" fill="#2b6cb0"/>
<text x="203" y="318" font-size="29" fill="#162233" font-weight="800" text-anchor="start">降低门槛</text>
<text x="203" y="362" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 自然语言描述目标即可启动排查</text>
<text x="203" y="404" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 减少对脚本和经验的强依赖</text>
</g>
<g filter="url(#shadow)">
<rect x="750" y="260" width="420" height="260" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="750" y="260" width="420" height="12" rx="18" fill="#1f8f7a"/>
<text x="778" y="318" font-size="29" fill="#162233" font-weight="800" text-anchor="start">提升效率</text>
<text x="778" y="362" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• Agent</text>
<text x="778" y="396" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  自动选择工具并汇总证据</text>
<text x="778" y="438" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 减少跨命令手工切换成本</text>
</g>
<g filter="url(#shadow)">
<rect x="1325" y="260" width="420" height="260" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1325" y="260" width="420" height="12" rx="18" fill="#d58b22"/>
<text x="1353" y="318" font-size="29" fill="#162233" font-weight="800" text-anchor="start">降低风险</text>
<text x="1353" y="362" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 高风险默认审批</text>
<text x="1353" y="404" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 未授权动作不执行</text>
</g>
<rect x="250" y="690" width="1420" height="110" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<text x="300" y="735" font-size="30" fill="#162233" font-weight="850" text-anchor="start">适用场景</text>
<text x="520" y="735" font-size="27" fill="#607385" font-weight="400" text-anchor="start">教育、医疗、政企数据中心等合规要求较高的 Linux 运维环境</text>
<text x="300" y="780" font-size="30" fill="#162233" font-weight="850" text-anchor="start">扩展方向</text>
<text x="520" y="780" font-size="27" fill="#607385" font-weight="400" text-anchor="start">更多 MCP 工具、eBPF 实时观测、麒麟安全策略联动、故障知识库沉淀</text>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">20/22</text>
  </g>
