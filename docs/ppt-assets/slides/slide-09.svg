<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">三层安全护栏，解决 AI 推理不可控</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">所有工具调用都经过审查、授权和记录，避免模型绕过执行边界</text>
  </g>
  <g filter="url(#shadow)">
<rect x="170" y="270" width="460" height="360" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="170" y="270" width="460" height="12" rx="18" fill="#1f8f7a"/>
<text x="198" y="328" font-size="29" fill="#162233" font-weight="800" text-anchor="start">第一层：web-server 审查</text>
<text x="198" y="372" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 统一拦截所有 tool_call</text>
<text x="198" y="414" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 规则匹配与审批流转</text>
<text x="198" y="456" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 审计事件写入</text>
</g>
<g filter="url(#shadow)">
<rect x="730" y="270" width="460" height="360" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="730" y="270" width="460" height="12" rx="18" fill="#d58b22"/>
<text x="758" y="328" font-size="29" fill="#162233" font-weight="800" text-anchor="start">第二层：tool-server 校验</text>
<text x="758" y="372" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 校验</text>
<text x="758" y="406" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  approval_status</text>
<text x="758" y="448" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 高风险工具要求</text>
<text x="758" y="482" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  request_id</text>
<text x="758" y="524" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 未授权返回 SECURITY_V</text>
<text x="758" y="558" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  IOLATION</text>
</g>
<g filter="url(#shadow)">
<rect x="1290" y="270" width="460" height="360" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1290" y="270" width="460" height="12" rx="18" fill="#2b6cb0"/>
<text x="1318" y="328" font-size="29" fill="#162233" font-weight="800" text-anchor="start">第三层：熔断与恢复</text>
<text x="1318" y="372" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 最大迭代轮次</text>
<text x="1318" y="414" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• Token 硬上限</text>
<text x="1318" y="456" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 工具超时和审批超时</text>
</g>
<rect x="340" y="760" width="260" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="340" y="760" width="260" height="10" rx="16" fill="#1f9d62"/>
<text x="470" y="816" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">只读自动执行</text>
<line x1="618" y1="806" x2="658" y2="806" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="678" y="760" width="260" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="678" y="760" width="260" height="10" rx="16" fill="#d58b22"/>
<text x="808" y="816" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">高风险需审批</text>
<line x1="956" y1="806" x2="996" y2="806" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1016" y="760" width="260" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1016" y="760" width="260" height="10" rx="16" fill="#c94a4a"/>
<text x="1146" y="816" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">黑名单拒绝</text>
<line x1="1294" y1="806" x2="1334" y2="806" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1354" y="760" width="260" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1354" y="760" width="260" height="10" rx="16" fill="#1f8f7a"/>
<text x="1484" y="816" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">审计留痕</text>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">09/22</text>
  </g>
</svg>