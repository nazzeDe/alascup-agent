<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">从系统指标到运维上下文的多维感知</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">覆盖性能、进程、日志、服务状态，并为深度内核观测预留扩展</text>
  </g>
  <g filter="url(#shadow)">
<rect x="170" y="245" width="350" height="165" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="170" y="245" width="350" height="12" rx="18" fill="#1f8f7a"/>
<text x="198" y="303" font-size="29" fill="#162233" font-weight="800" text-anchor="start">CPU</text>
<text x="198" y="347" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 负载 / 核心占用</text>
</g>
<g filter="url(#shadow)">
<rect x="590" y="245" width="350" height="165" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="590" y="245" width="350" height="12" rx="18" fill="#2b6cb0"/>
<text x="618" y="303" font-size="29" fill="#162233" font-weight="800" text-anchor="start">内存</text>
<text x="618" y="347" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 使用率 / OOM 风险</text>
</g>
<g filter="url(#shadow)">
<rect x="1010" y="245" width="350" height="165" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1010" y="245" width="350" height="12" rx="18" fill="#d58b22"/>
<text x="1038" y="303" font-size="29" fill="#162233" font-weight="800" text-anchor="start">磁盘</text>
<text x="1038" y="347" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 分区 / 目录占用</text>
</g>
<g filter="url(#shadow)">
<rect x="1430" y="245" width="350" height="165" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1430" y="245" width="350" height="12" rx="18" fill="#1f9d62"/>
<text x="1458" y="303" font-size="29" fill="#162233" font-weight="800" text-anchor="start">网络</text>
<text x="1458" y="347" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 连接 / 端口状态</text>
</g>
<g filter="url(#shadow)">
<rect x="170" y="465" width="350" height="165" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="170" y="465" width="350" height="12" rx="18" fill="#805ad5"/>
<text x="198" y="523" font-size="29" fill="#162233" font-weight="800" text-anchor="start">进程</text>
<text x="198" y="567" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 资源占用 / 僵尸进程</text>
</g>
<g filter="url(#shadow)">
<rect x="590" y="465" width="350" height="165" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="590" y="465" width="350" height="12" rx="18" fill="#dd6b20"/>
<text x="618" y="523" font-size="29" fill="#162233" font-weight="800" text-anchor="start">日志</text>
<text x="618" y="567" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• journalctl / 关键词</text>
</g>
<g filter="url(#shadow)">
<rect x="1010" y="465" width="350" height="165" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1010" y="465" width="350" height="12" rx="18" fill="#3182ce"/>
<text x="1038" y="523" font-size="29" fill="#162233" font-weight="800" text-anchor="start">服务</text>
<text x="1038" y="567" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• systemd status /</text>
<text x="1038" y="601" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  restart</text>
</g>
<g filter="url(#shadow)">
<rect x="1430" y="465" width="350" height="165" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1430" y="465" width="350" height="12" rx="18" fill="#2c7a7b"/>
<text x="1458" y="523" font-size="29" fill="#162233" font-weight="800" text-anchor="start">eBPF</text>
<text x="1458" y="567" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• tcpdrop /</text>
<text x="1458" y="601" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  oomkill /</text>
<text x="1458" y="635" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  biolatency</text>
</g>
<text x="210" y="830" font-size="31" fill="#1f8f7a" font-weight="800" text-anchor="start">核心价值：不是单点指标采集，而是为 Agent 提供可组合的运维证据上下文。</text>
<text x="210" y="885" font-size="25" fill="#607385" font-weight="400" text-anchor="start">边界说明：eBPF 当前作为预置探针与测试适配能力，不宣称替代完整监控平台。</text>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">07/22</text>
  </g>
</svg>