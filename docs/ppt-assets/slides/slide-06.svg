<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">让 Agent 像运维专家一样迭代排查</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">Thought - Action - Observation 循环把推理、工具和证据串起来</text>
  </g>
  <rect x="210" y="330" width="230" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="210" y="330" width="230" height="10" rx="16" fill="#1f8f7a"/>
<text x="325" y="386" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">Thought
理解目标</text>
<line x1="458" y1="376" x2="498" y2="376" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="518" y="330" width="230" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="518" y="330" width="230" height="10" rx="16" fill="#2b6cb0"/>
<text x="633" y="386" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">Action
调用工具</text>
<line x1="766" y1="376" x2="806" y2="376" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="826" y="330" width="230" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="826" y="330" width="230" height="10" rx="16" fill="#d58b22"/>
<text x="941" y="386" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">Observation
读取结果</text>
<line x1="1074" y1="376" x2="1114" y2="376" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1134" y="330" width="230" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1134" y="330" width="230" height="10" rx="16" fill="#1f9d62"/>
<text x="1249" y="386" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">Review
安全审查</text>
<line x1="1382" y1="376" x2="1422" y2="376" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1442" y="330" width="230" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1442" y="330" width="230" height="10" rx="16" fill="#1f8f7a"/>
<text x="1557" y="386" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">Done
输出结论</text>
<g filter="url(#shadow)">
<rect x="210" y="560" width="430" height="210" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="210" y="560" width="430" height="12" rx="18" fill="#1f8f7a"/>
<text x="238" y="618" font-size="29" fill="#162233" font-weight="800" text-anchor="start">并行只读预执行</text>
<text x="238" y="662" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 静态只读工具在 think</text>
<text x="238" y="696" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  结束后并行执行</text>
<text x="238" y="738" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 减少端到端诊断延迟</text>
</g>
<g filter="url(#shadow)">
<rect x="745" y="560" width="430" height="210" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="745" y="560" width="430" height="12" rx="18" fill="#2b6cb0"/>
<text x="773" y="618" font-size="29" fill="#162233" font-weight="800" text-anchor="start">循环退出条件</text>
<text x="773" y="662" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• LLM 判断完成</text>
<text x="773" y="704" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 轮次上限或 token 熔断</text>
<text x="773" y="746" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 审批拒绝或错误退出</text>
</g>
<g filter="url(#shadow)">
<rect x="1280" y="560" width="430" height="210" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1280" y="560" width="430" height="12" rx="18" fill="#d58b22"/>
<text x="1308" y="618" font-size="29" fill="#162233" font-weight="800" text-anchor="start">演示脚本</text>
<text x="1308" y="662" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 服务器响应变慢</text>
<text x="1308" y="704" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 排查 CPU 和内存异常</text>
<text x="1308" y="746" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 汇总高占用进程</text>
</g>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">06/22</text>
  </g>
</svg>