<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">把 OS 运维能力标准化为 Agent 可调用工具</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">插件化工具体系让能力边界清晰，新增工具无需改动核心 Agent 主循环</text>
  </g>
  <rect x="160" y="220" width="1600" height="610" rx="24" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<text x="220" y="290" font-size="34" fill="#162233" font-weight="850" text-anchor="start">MCP Tool Registry</text>
<rect x="220" y="340" width="310" height="92" rx="14" fill="#f8fbfd" stroke="#d7e3eb" stroke-width="2"/>
<rect x="220" y="340" width="10" height="92" rx="14" fill="#1f8f7a"/>
<text x="248" y="396" font-size="24" fill="#162233" font-weight="800" text-anchor="start">get_cpu_info</text>
<rect x="600" y="340" width="310" height="92" rx="14" fill="#f8fbfd" stroke="#d7e3eb" stroke-width="2"/>
<rect x="600" y="340" width="10" height="92" rx="14" fill="#2b6cb0"/>
<text x="628" y="396" font-size="24" fill="#162233" font-weight="800" text-anchor="start">get_memory_info</text>
<rect x="980" y="340" width="310" height="92" rx="14" fill="#f8fbfd" stroke="#d7e3eb" stroke-width="2"/>
<rect x="980" y="340" width="10" height="92" rx="14" fill="#d58b22"/>
<text x="1008" y="396" font-size="24" fill="#162233" font-weight="800" text-anchor="start">get_disk_usage</text>
<rect x="1360" y="340" width="310" height="92" rx="14" fill="#f8fbfd" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1360" y="340" width="10" height="92" rx="14" fill="#1f9d62"/>
<text x="1388" y="396" font-size="24" fill="#162233" font-weight="800" text-anchor="start">get_network_info</text>
<rect x="220" y="500" width="310" height="92" rx="14" fill="#f8fbfd" stroke="#d7e3eb" stroke-width="2"/>
<rect x="220" y="500" width="10" height="92" rx="14" fill="#1f8f7a"/>
<text x="248" y="556" font-size="24" fill="#162233" font-weight="800" text-anchor="start">get_process_list</text>
<rect x="600" y="500" width="310" height="92" rx="14" fill="#f8fbfd" stroke="#d7e3eb" stroke-width="2"/>
<rect x="600" y="500" width="10" height="92" rx="14" fill="#2b6cb0"/>
<text x="628" y="556" font-size="24" fill="#162233" font-weight="800" text-anchor="start">read_logs</text>
<rect x="980" y="500" width="310" height="92" rx="14" fill="#f8fbfd" stroke="#d7e3eb" stroke-width="2"/>
<rect x="980" y="500" width="10" height="92" rx="14" fill="#d58b22"/>
<text x="1008" y="556" font-size="24" fill="#162233" font-weight="800" text-anchor="start">bash / bash_classify</text>
<rect x="1360" y="500" width="310" height="92" rx="14" fill="#f8fbfd" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1360" y="500" width="10" height="92" rx="14" fill="#1f9d62"/>
<text x="1388" y="556" font-size="24" fill="#162233" font-weight="800" text-anchor="start">systemd status / restart</text>
<text x="220" y="720" font-size="28" fill="#1f8f7a" font-weight="800" text-anchor="start">统一元数据：is_read_only / is_rollbackable / mutable / hidden</text>
<text x="220" y="775" font-size="25" fill="#607385" font-weight="400" text-anchor="start">可变工具通过伴生分类工具进行运行时风险判断，例如 bash → bash_classify。</text>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">08/22</text>
  </g>
</svg>