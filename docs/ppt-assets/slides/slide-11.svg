<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">让关键操作可控地自动化</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">非只读动作必须经过人工确认，未授权不执行</text>
  </g>
  <rect x="180" y="320" width="300" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="180" y="320" width="300" height="10" rx="16" fill="#2b6cb0"/>
<text x="330" y="376" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">Agent 生成工具请求</text>
<line x1="498" y1="366" x2="538" y2="366" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="558" y="320" width="300" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="558" y="320" width="300" height="10" rx="16" fill="#d58b22"/>
<text x="708" y="376" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">审查层判定高风险</text>
<line x1="876" y1="366" x2="916" y2="366" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="936" y="320" width="300" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="936" y="320" width="300" height="10" rx="16" fill="#1f8f7a"/>
<text x="1086" y="376" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">用户内联审批</text>
<line x1="1254" y1="366" x2="1294" y2="366" stroke="#7890a4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1314" y="320" width="300" height="92" rx="16" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1314" y="320" width="300" height="10" rx="16" fill="#1f9d62"/>
<text x="1464" y="376" font-size="25" fill="#162233" font-weight="750" text-anchor="middle">tool-server 执行</text>
<g filter="url(#shadow)">
<rect x="205" y="575" width="440" height="240" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="205" y="575" width="440" height="12" rx="18" fill="#d58b22"/>
<text x="233" y="633" font-size="29" fill="#162233" font-weight="800" text-anchor="start">审批卡片</text>
<text x="233" y="677" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 展示工具名、参数、原因</text>
<text x="233" y="719" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 支持 Approve /</text>
<text x="233" y="753" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  Reject</text>
<text x="233" y="795" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 默认 5 分钟超时拒绝</text>
</g>
<g filter="url(#shadow)">
<rect x="740" y="575" width="440" height="240" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="740" y="575" width="440" height="12" rx="18" fill="#1f8f7a"/>
<text x="768" y="633" font-size="29" fill="#162233" font-weight="800" text-anchor="start">最小权限执行</text>
<text x="768" y="677" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• tool-server</text>
<text x="768" y="711" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  独立容器边界</text>
<text x="768" y="753" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• web-server</text>
<text x="768" y="787" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  不直接操作宿主机</text>
<text x="768" y="829" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 挂载范围与</text>
<text x="768" y="863" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  capabilities 约束</text>
</g>
<g filter="url(#shadow)">
<rect x="1275" y="575" width="440" height="240" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1275" y="575" width="440" height="12" rx="18" fill="#2b6cb0"/>
<text x="1303" y="633" font-size="29" fill="#162233" font-weight="800" text-anchor="start">执行校验</text>
<text x="1303" y="677" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 必须携带 APPROVED</text>
<text x="1303" y="719" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 高风险请求必须有</text>
<text x="1303" y="753" font-size="23" fill="#607385" font-weight="400" text-anchor="start">  request_id</text>
<text x="1303" y="795" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 违规直接拒绝并记录</text>
</g>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">11/22</text>
  </g>
</svg>