<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf4f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8499"/>
    </marker>
    <style>
      svg { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1660" cy="160" r="280" fill="#35c2a4" opacity="0.08"/>
  <circle cx="1460" cy="930" r="250" fill="#2b6cb0" opacity="0.07"/>
  <g>
    <text x="110" y="96" font-size="48" fill="#162233" font-weight="850" text-anchor="start">从服务状态到日志证据的根因分析</text>
    <text x="112" y="142" font-size="25" fill="#607385" font-weight="400" text-anchor="start">典型演示三：服务异常与日志分析</text>
  </g>
  <rect x="150" y="230" width="1620" height="600" rx="24" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<text x="210" y="300" font-size="30" fill="#162233" font-weight="850" text-anchor="start">演示输入</text>
<rect x="210" y="330" width="1180" height="76" rx="18" fill="#e8f2ff"/>
<text x="245" y="379" font-size="26" fill="#162233" font-weight="700" text-anchor="start">检查 nginx 服务状态和最近 30 分钟日志，判断是否有异常重启或错误。</text>
<text x="210" y="485" font-size="30" fill="#162233" font-weight="850" text-anchor="start">演示流程</text>
<rect x="220" y="501" width="58" height="48" rx="12" fill="#2b6cb0"/>
<text x="249" y="533" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="300" y="535" font-size="25" fill="#607385" font-weight="400" text-anchor="start">查询 systemd 服务状态</text>
<rect x="220" y="559" width="58" height="48" rx="12" fill="#2b6cb0"/>
<text x="249" y="591" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="300" y="593" font-size="25" fill="#607385" font-weight="400" text-anchor="start">读取限定时间范围日志</text>
<rect x="220" y="617" width="58" height="48" rx="12" fill="#2b6cb0"/>
<text x="249" y="649" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="300" y="651" font-size="25" fill="#607385" font-weight="400" text-anchor="start">识别错误关键词与异常重启</text>
<rect x="220" y="675" width="58" height="48" rx="12" fill="#2b6cb0"/>
<text x="249" y="707" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="300" y="709" font-size="25" fill="#607385" font-weight="400" text-anchor="start">涉及 restart 时进入审批</text>
<rect x="220" y="733" width="58" height="48" rx="12" fill="#2b6cb0"/>
<text x="249" y="765" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="300" y="767" font-size="25" fill="#607385" font-weight="400" text-anchor="start">输出根因、影响范围和建议</text>
<g filter="url(#shadow)">
<rect x="1220" y="470" width="460" height="260" rx="18" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
<rect x="1220" y="470" width="460" height="12" rx="18" fill="#2b6cb0"/>
<text x="1248" y="528" font-size="29" fill="#162233" font-weight="800" text-anchor="start">展示价值</text>
<text x="1248" y="572" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 日志分析</text>
<text x="1248" y="614" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 服务状态诊断</text>
<text x="1248" y="656" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 根因分析</text>
<text x="1248" y="698" font-size="23" fill="#607385" font-weight="400" text-anchor="start">• 先诊断后修复</text>
</g>
  <g>
    <text x="110" y="1024" font-size="20" fill="#607385" font-weight="400" text-anchor="start">Alascup Agent · 安全智能运维 Agent 软件功能演示</text>
    <text x="1810" y="1024" font-size="20" fill="#607385" font-weight="700" text-anchor="end">17/22</text>
