<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fb"/>
      <stop offset="1" stop-color="#e9f1ee"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182536"/>
      <stop offset="1" stop-color="#0d1623"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#182536" flood-opacity="0.22"/>
    </filter>
    <style>
      .font { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .muted { fill: #6a7a89; font-size: 24px; letter-spacing: 0; }
      .body { fill: #25313d; font-size: 25px; letter-spacing: 0; }
      .small { fill: #6a7a89; font-size: 20px; letter-spacing: 0; }
      .white { fill: #f8fbff; font-size: 24px; letter-spacing: 0; }
      .title { fill: #172333; font-size: 42px; font-weight: 800; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#page)"/>
  <g class="font" transform="translate(120 90)">
    <text x="0" y="0" class="title">对话式智能运维工作台</text>
    <text x="0" y="48" class="muted">推理过程、工具调用、安全审批和审计追踪在同一工作流中闭环呈现</text>
  </g>

  <g transform="translate(120 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="1680" height="820" rx="24" fill="#ffffff"/>
    <rect x="0" y="0" width="1680" height="70" rx="24" fill="url(#chrome)"/>
    <rect x="0" y="46" width="1680" height="30" fill="#0d1623"/>
    <circle cx="34" cy="35" r="10" fill="#ff6b6b"/>
    <circle cx="64" cy="35" r="10" fill="#ffd166"/>
    <circle cx="94" cy="35" r="10" fill="#4dd599"/>
    <text class="font white" x="140" y="44">Alascup Agent 控制台</text>

    <rect x="0" y="70" width="330" height="750" fill="#101927"/>
    <g class="font">
      <text x="34" y="126" fill="#dce8f3" font-size="28" font-weight="700">会话</text>
      <rect x="34" y="156" width="260" height="48" rx="10" fill="#1f8f7a"/>
      <text x="58" y="188" fill="#ffffff" font-size="22">+ New Session</text>
      <text x="34" y="250" fill="#7d91a6" font-size="20">Today</text>
      <rect x="24" y="272" width="282" height="62" rx="12" fill="#1a2a3d"/>
      <text x="46" y="309" fill="#e8f1fa" font-size="21">磁盘空间异常排查</text>
      <rect x="24" y="346" width="282" height="62" rx="12" fill="#132133"/>
      <text x="46" y="383" fill="#a8b9ca" font-size="21">nginx 服务状态检查</text>
      <text x="34" y="448" fill="#7d91a6" font-size="20">Previous 7 days</text>
      <rect x="24" y="470" width="282" height="62" rx="12" fill="#132133"/>
      <text x="46" y="507" fill="#a8b9ca" font-size="21">CPU 占用分析</text>
    </g>

    <rect x="330" y="70" width="1350" height="750" fill="#f7fafc"/>
    <g class="font" transform="translate(378 118)">
      <text x="0" y="0" font-size="30" font-weight="700" fill="#172333">磁盘空间异常排查</text>
      <text x="0" y="38" class="small">chat_id: 6f8a... / SSE streaming / MCP tool-server</text>
    </g>

    <g class="font" transform="translate(498 376)">
      <g transform="translate(540 0)">
        <rect x="0" y="0" width="560" height="70" rx="18" fill="#e8f2ff"/>
        <text x="34" y="43" class="body">磁盘快满了，请分析占用并给出清理建议。</text>
      </g>

      <g transform="translate(0 94)">
        <rect x="0" y="0" width="760" height="82" rx="18" fill="#ffffff" stroke="#dbe5ee"/>
        <text x="28" y="50" fill="#1f8f7a" font-size="24" font-weight="700">Reasoning</text>
        <text x="166" y="50" class="body">先收集磁盘、日志和进程证据，再判断风险。</text>
      </g>

      <g transform="translate(0 206)">
        <rect x="0" y="0" width="500" height="112" rx="18" fill="#ffffff" stroke="#dbe5ee"/>
        <rect x="24" y="26" width="44" height="38" rx="9" fill="#1f8f7a"/>
        <text x="39" y="53" fill="#ffffff" font-size="20" font-weight="700">R</text>
        <text x="88" y="49" class="body">get_disk_usage</text>
        <text x="88" y="83" class="small">server: tool-server</text>
        <rect x="356" y="35" width="92" height="42" rx="10" fill="#dff7eb"/>
        <text x="378" y="63" fill="#16794f" font-size="21">Done</text>
      </g>

      <g transform="translate(540 206)">
        <rect x="0" y="0" width="500" height="112" rx="18" fill="#ffffff" stroke="#dbe5ee"/>
        <rect x="24" y="26" width="44" height="38" rx="9" fill="#1f8f7a"/>
        <text x="39" y="53" fill="#ffffff" font-size="20" font-weight="700">R</text>
        <text x="88" y="49" class="body">read_logs</text>
        <text x="88" y="83" class="small">grep: error, since: 30min</text>
        <rect x="356" y="35" width="92" height="42" rx="10" fill="#dff7eb"/>
        <text x="378" y="63" fill="#16794f" font-size="21">Done</text>
      </g>

      <g transform="translate(0 350)">
        <rect x="0" y="0" width="1040" height="150" rx="18" fill="#fff8ea" stroke="#f0c56b" stroke-width="2"/>
        <rect x="26" y="28" width="50" height="44" rx="10" fill="#d58b22"/>
        <text x="42" y="58" fill="#ffffff" font-size="20" font-weight="700">W</text>
        <text x="98" y="58" fill="#172333" font-size="26" font-weight="700">需要审批：清理 /var/log/app/*.old</text>
        <text x="98" y="98" class="body">该操作会删除日志归档文件，需确认业务影响与保留策略。</text>
        <rect x="752" y="92" width="116" height="42" rx="10" fill="#1f8f7a"/>
        <text x="784" y="120" fill="#ffffff" font-size="21">Approve</text>
        <rect x="888" y="92" width="104" height="42" rx="10" fill="#ffffff" stroke="#d58b22"/>
        <text x="914" y="120" fill="#9a5b14" font-size="21">Reject</text>
      </g>

      <g transform="translate(0 530)">
        <rect x="0" y="0" width="1040" height="76" rx="18" fill="#ffffff" stroke="#dbe5ee"/>
        <text x="28" y="47" class="body">结论：磁盘压力主要来自应用日志归档；建议先压缩备份，再审批清理。</text>
      </g>
    </g>
  </g>
</svg>
