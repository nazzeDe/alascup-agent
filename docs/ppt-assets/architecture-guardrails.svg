<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf4f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#142235" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { fill: #142235; font-size: 48px; font-weight: 800; letter-spacing: 0; }
      .sub { fill: #5b6b7a; font-size: 25px; letter-spacing: 0; }
      .h { fill: #142235; font-size: 30px; font-weight: 700; letter-spacing: 0; }
      .b { fill: #405160; font-size: 22px; letter-spacing: 0; }
      .w { fill: #ffffff; font-size: 25px; font-weight: 700; letter-spacing: 0; }
      .tag { fill: #eaf9f4; font-size: 20px; letter-spacing: 0; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5d768f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g class="font" transform="translate(110 82)">
    <text x="0" y="0" class="title">安全智能运维 Agent 总体架构</text>
    <text x="0" y="48" class="sub">感知 - 决策 - 护栏三层协同，完成自然语言诊断、MCP 工具调用、审批执行与全链路审计</text>
  </g>

  <g class="font">
    <g transform="translate(110 205)" filter="url(#shadow)">
      <rect width="320" height="660" rx="20" fill="#102033"/>
      <text x="40" y="62" class="w">用户与前端展示层</text>
      <rect x="36" y="104" width="248" height="92" rx="14" fill="#19304a"/>
      <text x="64" y="142" class="tag">Vue 3 聊天界面</text>
      <text x="64" y="176" class="tag">SSE 流式响应</text>
      <rect x="36" y="222" width="248" height="92" rx="14" fill="#19304a"/>
      <text x="64" y="260" class="tag">工具调用展示</text>
      <text x="64" y="294" class="tag">审批卡片</text>
      <rect x="36" y="340" width="248" height="92" rx="14" fill="#19304a"/>
      <text x="64" y="378" class="tag">历史会话</text>
      <text x="64" y="412" class="tag">错误提示</text>
      <rect x="36" y="486" width="248" height="88" rx="44" fill="#1f8f7a"/>
      <text x="83" y="540" fill="#ffffff" font-size="27" font-weight="700">自然语言目标</text>
    </g>

    <g transform="translate(520 205)" filter="url(#shadow)">
      <rect width="430" height="660" rx="20" fill="#ffffff"/>
      <rect width="430" height="76" rx="20" fill="#1d7769"/>
      <text x="34" y="50" class="w">智能编排层 web-server</text>
      <text x="34" y="125" class="h">AgentLoop / ReAct</text>
      <rect x="34" y="154" width="362" height="66" rx="12" fill="#eef8f5" stroke="#b8ded5"/>
      <text x="62" y="196" class="b">Thought → Action → Observation</text>
      <text x="34" y="274" class="h">上下文与恢复</text>
      <rect x="34" y="304" width="362" height="92" rx="12" fill="#f7fafc" stroke="#d8e3eb"/>
      <text x="62" y="342" class="b">Context Manager</text>
      <text x="62" y="376" class="b">Token 上限与模型恢复</text>
      <text x="34" y="452" class="h">SSE 事件通道</text>
      <rect x="34" y="482" width="362" height="88" rx="12" fill="#f7fafc" stroke="#d8e3eb"/>
      <text x="62" y="520" class="b">reasoning / tool_call</text>
      <text x="62" y="554" class="b">tool_result / approval / done</text>
    </g>

    <g transform="translate(1045 205)" filter="url(#shadow)">
      <rect width="365" height="660" rx="20" fill="#fffaf0"/>
      <rect width="365" height="76" rx="20" fill="#d58b22"/>
      <text x="34" y="50" class="w">安全护栏层</text>
      <text x="34" y="124" class="h">规则审查</text>
      <rect x="34" y="152" width="296" height="76" rx="12" fill="#ffffff" stroke="#eccb8a"/>
      <text x="58" y="184" class="b">白名单 / 黑名单</text>
      <text x="58" y="214" class="b">只读自动通过</text>
      <text x="34" y="282" class="h">风险分类</text>
      <rect x="34" y="310" width="296" height="100" rx="12" fill="#ffffff" stroke="#eccb8a"/>
      <text x="58" y="342" class="b">bash_classify</text>
      <text x="58" y="374" class="b">AST 解析 fail-closed</text>
      <text x="58" y="404" class="b">敏感路径拦截</text>
      <text x="34" y="464" class="h">审批与熔断</text>
      <rect x="34" y="492" width="296" height="92" rx="12" fill="#ffffff" stroke="#eccb8a"/>
      <text x="58" y="526" class="b">人工确认高风险操作</text>
      <text x="58" y="558" class="b">超时自动拒绝</text>
    </g>

    <g transform="translate(1505 205)" filter="url(#shadow)">
      <rect width="305" height="660" rx="20" fill="#ffffff"/>
      <rect width="305" height="76" rx="20" fill="#2b6cb0"/>
      <text x="34" y="50" class="w">MCP 工具层</text>
      <rect x="34" y="116" width="236" height="76" rx="12" fill="#edf5ff" stroke="#bdd4f0"/>
      <text x="58" y="150" class="b">CPU / 内存 / 磁盘</text>
      <text x="58" y="180" class="b">网络 / 进程 / 日志</text>
      <rect x="34" y="224" width="236" height="76" rx="12" fill="#edf5ff" stroke="#bdd4f0"/>
      <text x="58" y="258" class="b">bash 运维命令</text>
      <text x="58" y="288" class="b">systemd 状态 / 重启</text>
      <rect x="34" y="332" width="236" height="76" rx="12" fill="#edf5ff" stroke="#bdd4f0"/>
      <text x="58" y="366" class="b">eBPF 探针预置</text>
      <text x="58" y="396" class="b">oomkill / tcpdrop</text>
      <rect x="34" y="466" width="236" height="96" rx="16" fill="#102033"/>
      <text x="76" y="504" fill="#eaf9f4" font-size="22">麒麟 OS 节点</text>
      <text x="76" y="538" fill="#91a8bd" font-size="19">LoongArch / Linux</text>
    </g>

    <g stroke="#5d768f" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M430 530 C465 530, 480 530, 520 530"/>
      <path d="M950 530 C990 530, 1005 530, 1045 530"/>
      <path d="M1410 530 C1452 530, 1466 530, 1505 530"/>
    </g>

    <g transform="translate(520 920)" filter="url(#shadow)">
      <rect width="890" height="90" rx="18" fill="#ffffff"/>
      <rect x="28" y="22" width="148" height="46" rx="10" fill="#eef8f5"/>
      <text x="52" y="53" fill="#1d7769" font-size="22" font-weight="700">PostgreSQL</text>
      <text x="205" y="54" class="b">会话、消息、工具调用、审计事件、LLM trace 全链路持久化</text>
    </g>
    <path d="M735 865 V920" stroke="#5d768f" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
    <path d="M1228 865 V920" stroke="#5d768f" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  </g>
</svg>
