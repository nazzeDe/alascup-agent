[project]
name = "rag-server"
version = "0.1.0"
description = "运维经验库 — 语义检索与知识写入"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "fastmcp>=3.2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=6"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
