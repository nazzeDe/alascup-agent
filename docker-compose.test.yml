services:
  # 前端 (Vue 3 静态页面 + Nginx)
  frontend:
    build:
      context: ./frontend
    restart: "no"
    ports:
      - "80:8080"
    depends_on:
      - web-server

  # 核心编排层（Mock LLM）
  web-server:
    build:
      context: ./web-server
    container_name: web-server-test
    restart: "no"
    working_dir: /app
    environment:
      - HOST=0.0.0.0
      - PORT=11450
      - DATABASE_URL=postgresql+asyncpg://alascup:alascup@postgres:5432/alascup
      - LLM_MOCK=true
      - TOOL_REQUEST_TIMEOUT_SECONDS=3
      - LOG_LEVEL=DEBUG
      - TOOLSERVER_SHARED_SECRET=test-toolserver-secret
    volumes:
      - ./web-server/config:/app/config:ro,Z
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/logs:size=16m,mode=1777
    ports:
      - "11450:11450"
    depends_on:
      - postgres
      - tool-server

  # 工具执行层（临时文件系统，无宿主机挂载）
  tool-server:
    build:
      context: ./tool-server
    container_name: tool-server-test
    restart: "no"
    working_dir: /app
    environment:
      - TOOLSERVER_PROC_PATH=/tmp/test-proc
      - TOOLSERVER_LOG_DIR=/tmp/test-log
      - TOOLSERVER_SANDBOX_ROOT=/tmp/sandbox
      - TOOLSERVER_HOST=0.0.0.0
      - TOOL_SERVER_LOG_LEVEL=DEBUG
      - TOOLSERVER_SHARED_SECRET=test-toolserver-secret
      - POSTGRES_DSN=postgresql://alascup:alascup@postgres:5432/alascup
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro,Z
      - /sys/kernel/btf:/sys/kernel/btf:ro,Z
    read_only: false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /tmp/test-proc:size=16m,mode=1777
      - /tmp/test-sys:size=16m,mode=1777
      - /tmp/test-log:size=16m,mode=1777
    ports:
      - "11451:11451"

  postgres:
    image: postgres:17
    container_name: postgres-test
    restart: "no"
    environment:
      - POSTGRES_USER=alascup
      - POSTGRES_PASSWORD=alascup
      - POSTGRES_DB=alascup
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=1777
