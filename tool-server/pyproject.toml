[project]
name = "tool-server"
version = "0.1.0"
description = "A mcp server implement"
requires-python = ">=3.13"
dependencies = [
	"fastmcp>=3.2.4",
	"psutil>=7.0.0",
	"tree-sitter>=0.22",
	"tree-sitter-bash>=0.23.5",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=6"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "lizard>=1.22.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.15.13",
    "vulture>=2.16",
]

