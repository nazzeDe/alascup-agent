[project]
name = "tool-server"
version = "0.1.0"
description = "A mcp server implement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastmcp>=3.2.4",
	"psutil>=7.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=6"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

