[project]
name = "web-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "deepagents>=0.5.3",
    "fastapi>=0.136.1",
    "fastmcp>=3.2.4",
    "langchain>=1.2.15",
    "langgraph>=1.1.9",
    "loguru>=0.7,<1",
    "pydantic>=2,<3",
    "pytest>=9.0.3",
    "uvicorn",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=6", "pytest-asyncio>=0.24", "httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
