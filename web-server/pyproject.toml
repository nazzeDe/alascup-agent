[project]
name = "web-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "fastmcp>=3.2.4",
    "loguru>=0.7,<1",
    "pydantic>=2,<3",
    "pytest>=9.0.3",
    "tiktoken>=0.13.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "radon",
    "vulture",
    "pylint",
    "bandit",
    "lizard",
    "pytest-cov",
    "mutmut",
    "wily",
    "xenon",
    "ruff",
    "mypy",
    "basedpyright",
    "pre-commit",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=6", "pytest-asyncio>=0.24", "httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
